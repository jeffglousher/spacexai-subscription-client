---
name: Release

"on":
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify current main and release notes
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/main:refs/remotes/origin/main
          python3 script/check_release.py \
            --release-tag "$GITHUB_REF_NAME" \
            --release-commit "$GITHUB_SHA" \
            --main-commit "$(git rev-parse refs/remotes/origin/main)"

  build:
    name: Release checks on Python ${{ matrix.python-version }}
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          enable-cache: false
          python-version: ${{ matrix.python-version }}
          version: "0.12.7"
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy --strict src/spacexai_subscription_client script
      - run: uv run --no-sync pytest --cov=spacexai_subscription_client --cov-fail-under=95
      - run: uv build
      - run: uvx --from twine==7.0.0 twine check --strict dist/*
      - run: uv run --no-sync python script/check_release.py --dist dist
      - name: Verify wheel installation
        run: >-
          uv run --isolated --no-project --python '${{ matrix.python-version }}'
          --with dist/*.whl python -I -c
          "from importlib.metadata import version;
          from spacexai_subscription_client import SpaceXAISubscriptionClient;
          print(version('spacexai-subscription-client'))"
      - name: Verify source distribution installation
        run: >-
          uv run --isolated --no-project --python '${{ matrix.python-version }}'
          --with dist/*.tar.gz python -I -c
          "from importlib.metadata import version;
          from spacexai_subscription_client import SpaceXAISubscriptionClient;
          print(version('spacexai-subscription-client'))"
      # v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: matrix.python-version == '3.14'
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/spacexai-subscription-client/
    permissions:
      id-token: write  # Required for PyPI trusted publishing.
    steps:
      # v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-package-distributions
          path: dist/
      # release/v1
      - uses: >-
          pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
