---
name: CI

"on":
  pull_request:
  push:
    branches:
      - main
      - harden-initial-release
      - "spacexai/client-*"
      - codex/initial-client-compatibility

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.12.7"
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy --strict src/spacexai_subscription_client script
      - run: uv run --no-sync pytest --cov=spacexai_subscription_client --cov-fail-under=95
      - run: uv build
      - run: uvx --from twine==7.0.0 twine check --strict dist/*
      - run: uv run --no-sync python script/check_release.py --dist dist
      - name: Verify wheel installation
        run: >-
          uv run --isolated --no-project --python '${{ matrix.python-version }}'
          --with dist/*.whl python -I -c
          "from importlib.metadata import version;
          from spacexai_subscription_client import SpaceXAISubscriptionClient;
          print(version('spacexai-subscription-client'))"
      - name: Verify source distribution installation
        run: >-
          uv run --isolated --no-project --python '${{ matrix.python-version }}'
          --with dist/*.tar.gz python -I -c
          "from importlib.metadata import version;
          from spacexai_subscription_client import SpaceXAISubscriptionClient;
          print(version('spacexai-subscription-client'))"
